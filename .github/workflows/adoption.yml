name: Adoption

# Weekly count of public repos using the git-card Action. Read it in the run's summary.
on:
  schedule:
    - cron: '41 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  count:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Count repos using the Action
        run: pnpm exec tsx scripts/adoption.ts
        env:
          GITHUB_TOKEN: ${{ github.token }}
